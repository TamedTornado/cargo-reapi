[package]
name = "cargo-reapi"
version = "0.2.10"
edition = "2024"
default-run = "cargo-reapi"
license = "MIT OR Apache-2.0"
description = "Cargo-authoritative shared build caching with experimental REAPI execution"
readme = "README.md"
repository = "https://github.com/TamedTornado/cargo-reapi"
keywords = ["cargo", "build-cache", "remote-execution", "reapi", "rustc"]
categories = [
    "caching",
    "command-line-utilities",
    "development-tools::build-utils",
    "development-tools::cargo-plugins",
]
rust-version = "1.88"
exclude = [
    "/.dockerignore",
    "/.github/**",
    "/.gitignore",
    "/AGENTS.md",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
memchr = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "0.9"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# For this crate's own tests only; never enable it for a build you use.
# It compiles in test synchronization and a switch that skips the whole-gate
# snapshot (`CARGO_REAPI_ACTION_CACHE_TEST_MODE`), which a release build does
# not contain. The integration tests that need them require it: run the suite
# with `cargo test --features test-hooks`.
test-hooks = []

[[test]]
name = "capture"
path = "tests/capture.rs"
required-features = ["test-hooks"]

[[test]]
name = "coalescing"
path = "tests/coalescing.rs"
required-features = ["test-hooks"]

[[test]]
name = "dependency_relocation"
path = "tests/dependency_relocation.rs"
required-features = ["test-hooks"]

[[test]]
name = "environment"
path = "tests/environment.rs"
required-features = ["test-hooks"]

[[test]]
name = "pipelining"
path = "tests/pipelining.rs"
required-features = ["test-hooks"]

[lints.clippy]
all = "warn"
pedantic = "warn"
